include:
  - docker-compose.base.yml
services:
  termit-nginx:
    image: nginx:alpine
    ports:
      - ${HOST_PORT:-1234}:80
    restart: always
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      ROOT: ${ROOT}
      ORIGIN: ${URL}
      PORT: ${PUBLIC_PORT:-''}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template